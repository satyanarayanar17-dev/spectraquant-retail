[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectraquant-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2",
    "sqlalchemy>=2",
    "greenlet>=3",
    "asyncpg",
    "redis>=5",
    "structlog>=24",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "pandas>=2.2",
    "numpy>=2.0",
    "statsmodels>=0.14",
    "pandas-market-calendars",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "aiosqlite>=0.20",
    "pandas-stubs",
    "types-python-dateutil",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
    "error::FutureWarning",
    "error::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "jose",
    "jose.*",
    "structlog",
    "structlog.*",
    "spectraquant_core",
    "spectraquant_core.*",
    "yfinance",
    "sentry_sdk",
    "sentry_sdk.*",
    "statsmodels",
    "statsmodels.*",
    "pandas_market_calendars",
    "pandas_market_calendars.*",
    "asyncpg",
    "asyncpg.*",
    "redis",
    "redis.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "src.jobs.*"
ignore_errors = true

# Tests are exercised by pytest, not mypy. Strict typing on production code
# stays — but pytest fixture parameters and a few monkeypatch tricks generate
# noise that doesn't reflect production-code quality.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
warn_return_any = false
disable_error_code = ["arg-type", "attr-defined", "return-value", "no-any-return", "no-untyped-def"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
