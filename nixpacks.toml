# Nixpacks build configuration for Railway.
#
# The apps/api service deploys from the repo root. Without this file, Nixpacks
# auto-detects the repo as Node.js (because apps/web/package.json exists at a
# sibling path) and builds in a Node-only image where `pip` is missing.
#
# Forcing the Python provider gives us a Python 3.12 toolchain at build time
# and lets railway.json drive the actual build/start commands.

providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"
