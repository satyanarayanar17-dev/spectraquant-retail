[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectraquant-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "statsmodels>=0.14",
    "pydantic>=2",
    "pandas-market-calendars",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "mypy>=1.10",
    "ruff>=0.4",
    "pandas-stubs",
    "types-python-dateutil",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spectraquant_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
